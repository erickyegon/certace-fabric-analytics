name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Notebooks are valid
        run: |
          python - <<'PY'
          import glob, nbformat
          files = glob.glob("**/*.ipynb", recursive=True)
          assert files, "no notebooks found"
          for f in files:
              nbformat.validate(nbformat.read(f, as_version=4))
              print("ok", f)
          PY

      - name: Fabric and KQL assets are present and non-empty
        run: |
          for f in 06_semantic_model/measures/*.dax 08_kql/*.kql; do
            test -s "$f" || { echo "empty: $f"; exit 1; }
          done

      - name: Medallion pipeline runs locally (pandas)
        run: python notebooks/medallion_local.py

      - name: Gold output was produced
        run: test -s output/gold_sales_by_category_region.csv
